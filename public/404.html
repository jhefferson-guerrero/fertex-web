<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#09090b" />
  <title>404 | FERTEX</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #fafafa;
      color: #09090b;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border: 8px solid #09090b;
      box-shadow: 16px 16px 0 0 #18181b;
    }

    .code {
      padding: 32px;
      border-bottom: 8px solid #09090b;
      background: #09090b;
      color: #CC0000;
      font-family: Oswald, Impact, "Arial Narrow", sans-serif;
      font-weight: 900;
      font-size: clamp(6rem, 25vw, 12rem);
      line-height: 0.9;
      letter-spacing: -0.05em;
    }

    .body { padding: 32px; }

    h1 {
      font-family: Oswald, Impact, "Arial Narrow", sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.6;
      color: #27272a;
      border-left: 4px solid #CC0000;
      padding-left: 16px;
      margin-bottom: 32px;
    }

    a {
      display: inline-block;
      background: #CC0000;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.125rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 32px;
      border: 4px solid #09090b;
      box-shadow: 6px 6px 0 0 #18181b;
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    a:hover {
      background: #09090b;
      box-shadow: none;
      transform: translate(6px, 6px);
    }

    a:focus-visible { outline: 4px solid #CC0000; outline-offset: 3px; }

    @media (max-width: 480px) {
      .card { box-shadow: 8px 8px 0 0 #18181b; }
      a { display: block; text-align: center; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="code" aria-hidden="true">404</div>
    <div class="body">
      <h1>Esta página no existe</h1>
      <p>El enlace que buscas no está disponible o fue movido. Vuelve al inicio y sigue entrenando con nosotros.</p>
      <a href="/">Volver al inicio</a>
    </div>
  </main>
</body>

</html>
